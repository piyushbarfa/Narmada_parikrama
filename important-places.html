    <style>
      /* Midnight River Design System */
      :root {
        --bg-midnight: #0B1319;
        --glass-bg: rgba(255, 255, 255, 0.04);
        --glass-border: rgba(255, 255, 255, 0.08);
        --teal-accent: #00796b;
        --gold-accent: #D4AF37;
        --text-main: #ffffff;
        --text-muted: #a0aec0;
      }

      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        color: var(--text-main);
        background-color: var(--bg-midnight);
        overflow: hidden; /* Lock viewport for Master-Detail layout */
      }

      h1, h2, h3, .playfair {
        font-family: 'Playfair Display', serif;
      }

      .hindi-text {
        font-family: 'Noto Sans Devanagari', sans-serif;
      }

      /* Glassmorphic Navbar */
      .navbar {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 1.5rem 4rem;
        z-index: 100;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        box-sizing: border-box;
        background: rgba(11, 19, 25, 0.5);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--glass-border);
      }

      .nav-links {
        display: flex;
        gap: 2rem;
      }

      .nav-link {
        color: white;
        text-decoration: none;
        font-weight: 600;
        font-size: 1.1rem;
        transition: color 0.3s ease;
      }

      .nav-link:hover {
        color: var(--gold-accent);
      }

      /* Master-Detail Layout Architecture */
      .master-detail-container {
        display: flex;
        height: 100vh;
        padding-top: 80px; /* Accounts for navbar */
        box-sizing: border-box;
      }

      /* LEFT COLUMN (60% Details & Media) */
      .detail-column {
        width: 60%;
        padding: 2rem;
        position: relative;
      }

      .media-container {
        width: 100%;
        height: 100%;
        border-radius: 24px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        background: #1a202c; /* Fallback loading color */
      }

      .media-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
      }

      .image-overlay-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(11, 19, 25, 0.9) 0%, rgba(0,0,0,0) 60%);
        z-index: 1;
      }

      .info-overlay {
        position: absolute;
        bottom: 2.5rem;
        left: 2.5rem;
        width: calc(100% - 5rem);
        max-width: 600px;
        background: rgba(20, 30, 40, 0.65);
        backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 2rem;
        z-index: 2;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      }

      .info-title {
        font-size: 2.2rem;
        margin: 0 0 1rem 0;
        color: #ffffff;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      }

      .info-desc {
        font-size: 1.1rem;
        line-height: 1.7;
        color: #e2e8f0;
        margin-bottom: 2rem;
      }

      .btn-explore {
        display: inline-block;
        padding: 0.8rem 1.8rem;
        background: var(--gold-accent);
        color: #000000;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        border-radius: 50px;
        text-decoration: none;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
      }

      .btn-explore:hover {
        transform: translateY(-3px);
        background: #e6c24b;
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
      }

      /* RIGHT COLUMN (40% Interactive List) */
      .master-column {
        width: 40%;
        padding: 2rem 3rem 2rem 1.5rem;
        overflow-y: auto;
        box-sizing: border-box;
      }

      /* Custom thin dark teal scrollbar */
      .master-column::-webkit-scrollbar {
        width: 6px;
      }
      .master-column::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
      }
      .master-column::-webkit-scrollbar-thumb {
        background: var(--teal-accent);
        border-radius: 10px;
      }

      .page-title {
        font-size: 2.5rem;
        margin-top: 0;
        margin-bottom: 2.5rem;
        color: var(--gold-accent);
        line-height: 1.2;
      }

      .category-title {
        font-size: 0.95rem;
        color: var(--teal-accent);
        margin: 2rem 0 1rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 600;
      }

      /* List Items */
      .place-item {
        padding: 1.2rem 1.5rem;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-right: 3px solid transparent;
        border-radius: 12px;
        margin-bottom: 1rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        opacity: 0.6;
      }

      .place-item:hover {
        opacity: 1;
        background: rgba(255, 255, 255, 0.08);
        border-right: 3px solid var(--gold-accent);
        transform: translateX(-4px);
      }

      .place-item.active {
        opacity: 1;
        background: linear-gradient(90deg, rgba(0,121,107,0.3) 0%, rgba(0,121,107,0.05) 100%);
        border-right: 4px solid var(--gold-accent);
        border-left: 1px solid var(--teal-accent);
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      }

      .place-title {
        font-size: 1.25rem;
        margin: 0 0 0.3rem 0;
        color: #ffffff;
      }

      .place-subtitle {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin: 0;
      }

      /* Mobile Responsiveness */
      @media (max-width: 768px) {
        .navbar { padding: 1rem; justify-content: center; }
        .nav-links { gap: 1rem; flex-wrap: wrap; justify-content: center; }
        .nav-link { font-size: 0.9rem; }
        
        .master-detail-container { flex-direction: column; padding-top: 70px; }
        .detail-column { width: 100%; height: 45%; padding: 1rem; }
        .master-column { width: 100%; height: 55%; padding: 1rem 1rem 2rem 1rem; }
        
        .info-overlay { bottom: 1rem; left: 1rem; width: calc(100% - 2rem); padding: 1rem; }
        .info-title { font-size: 1.3rem; margin-bottom: 0.5rem; }
        .info-desc { font-size: 0.85rem; margin-bottom: 1rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .btn-explore { padding: 0.5rem 1rem; font-size: 0.85rem; }
        
        .page-title { font-size: 1.8rem; margin-bottom: 1rem; text-align: center; }
        .category-title { margin: 1rem 0 0.5rem; }
        .place-item { padding: 0.8rem 1rem; }
      }
    </style>

      function renderList() {
        let currentCategory = '';
        let html = '';

        placesData.forEach(place => {
          if (place.category !== currentCategory) {
            html += `<h3 class="category-title hindi-text">${place.category}</h3>`;
            currentCategory = place.category;
          }
          
          html += `
            <div class="place-item" id="item-${place.id}" onclick="selectPlace('${place.id}')">
              <h4 class="place-title hindi-text">${place.title}</h4>
              <p class="place-subtitle">${place.subtitle}</p>
            </div>
          `;
        });

        listContainer.innerHTML = html;
      }

      // Handle Selection & Animation
      function selectPlace(id) {
        if (activeId === id) return; // Prevent re-animating the same item
        activeId = id;

        const place = placesData.find(p => p.id === id);

        // UI Updates for the List
        document.querySelectorAll('.place-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`item-${id}`).classList.add('active');

        // Cinematic Transition via GSAP
        const tl = gsap.timeline();

        // 1. Fade image to dark (not completely black for smoother UX) & slide text down
        tl.to(detailImage, { opacity: 0.3, duration: 0.3, ease: "power2.inOut" }, 0)
          .to(".info-overlay", { y: 20, opacity: 0, duration: 0.3, ease: "power2.in" }, 0)
          
          // 2. Swap data instantly while hidden
          .call(() => {
            detailImage.src = place.image;
            detailTitle.innerText = place.title;
            detailDesc.innerText = place.desc;
          })
          
          // 3. Reveal new content
          .to(detailImage, { opacity: 1, duration: 0.6, ease: "power2.out" })
          .to(".info-overlay", { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, "-=0.4");
      }

      // Boot up
      init();
    </script>
  </body>
</html>
